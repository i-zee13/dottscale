<section class="contact-us-form custom-from-contact-us">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="contact-us-form-card">
                            <div class="row">
                                <div class="col-lg-6">
                                </div>
                                <div class="col-lg-6">
                                    <h2>Send us a message.</h2>
                                    <form id="contact-form">
                                        <div class="row">
                                            <div class="col-md-6 form-group">
                                                <label for="firstName" class="form-label">First name*</label>
                                                <input type="text" class="form-control contact-required" name="first_name"
                                                    id="first_name" placeholder="Enter first name" required>
                                                <div class="invalid-feedback">Please provide a valid first name.</div>
                                            </div>
                                            <div class="col-md-6 form-group">
                                                <label for="lastName" class="form-label">Last name*</label>
                                                <input type="text" class="form-control contact-required" name="last_name" id="last_name"
                                                    placeholder="Enter last name" required>
                                                <div class="invalid-feedback">Please provide a valid last name.</div>
                                            </div>
                                            <div class="col-md-6 form-group">
                                                <label for="email" class="form-label">Email Address*</label>
                                                <input type="email" class="form-control contact-required" name="email" id="email"
                                                    placeholder="example@gmail.com" required>
                                                <div class="invalid-feedback">Please provide a valid email address.
                                                </div>
                                            </div>
                                            <div class="col-md-6 form-group">
                                                <label for="phone" class="form-label">Phone number</label>
                                                <input type="tel" class="form-control contact-required" name="phone" id="phone"
                                                    placeholder="Enter phone number">
                                                <div class="invalid-feedback">Please provide a valid phone number.</div>
                                            </div>
                                            <div class="col-md-12 form-group">
                                                <label for="description" class="form-label">Message*</label>
                                                <textarea class="form-control contact-required" name="message" id="description"
                                                    placeholder="Enter message*" required></textarea>
                                                <div class="invalid-feedback">Please provide a message.</div>
                                            </div>
                                            <div class="col-12">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" value=""
                                                        id="contact-accept-agreement">
                                                    <label class="form-check-label" for="defaultCheck1">
                                                        By submitting this form, you agree to receive electronic
                                                        communications from us, such as marketing emails. You can opt
                                                        out at any time.
                                                    </label>
                                                </div>
                                            </div>
                                    </form>
                                </div>
                                <div class="row">
                                    <div class="col-md-12 form-group pt-2 m-0">
                                        <button type="button" id="" class="btn btn-primary save-contact"
                                            title="Submit">Submit</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </section>
